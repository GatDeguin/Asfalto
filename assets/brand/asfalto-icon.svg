  <linearGradient id="steel" x1=".05" y1=".08" x2=".95" y2=".85"><stop stop-color="#FFFFFF"/><stop offset=".22" stop-color="#DCEEF1"/><stop offset=".5" stop-color="#8EA5B2"/><stop offset=".66" stop-color="#EAF5F8"/><stop offset="1" stop-color="#9DAAB2"/></linearGradient>
  <linearGradient id="rightsteel" x1=".15" y1=".1" x2=".85" y2="1"><stop stop-color="#F8FBF9"/><stop offset=".4" stop-color="#C4D9DC"/><stop offset=".73" stop-color="#788E9D"/><stop offset="1" stop-color="#E8F2F5"/></linearGradient>
