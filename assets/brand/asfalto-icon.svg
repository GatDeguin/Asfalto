  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45D1FA" stop-opacity="0"/><stop offset=".23" stop-color="#42C8ED"/><stop offset=".52" stop-color="#B4E9FA"/><stop offset=".8" stop-color="#43BCE6"/><stop offset="1" stop-color="#43C9F1" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="17"/></filter>
  <clipPath id="rounded"><rect x="0" y="0" width="1024" height="1024" rx="218"/></clipPath>
</defs>
