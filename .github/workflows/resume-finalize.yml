name: Final audit integration and verification
on:
  push:
    branches: [fixes/audit-20260919]
    paths: [.github/workflows/resume-finalize.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/fixes/audit-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.integrate.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exact reviewed delta, test, and commit to the repair branch
        id: integrate
        run: |
          mkdir -p qa-output
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,zlib
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='b53e24b4b24977e0fa2b6c764b278586e22ab2813f901d1ba89b11aec233e980'
          manifest=json.loads(raw);prepared=[]
          allowed={'src/legacy/module-02.mjs','tools/maintenance-browser-qa.py','tools/audit-preparation-isolation.test.mjs'}
          assert {v['path'] for v in manifest}==allowed
          for item in manifest:
              p=pathlib.Path(item['path']);before=p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(before).hexdigest()==item['before'],str(p)+' changed since review'
              text=before.decode()
              for edit in reversed(item['edits']):
                  i=edit['start'];text=text[:i]+edit['insert']+text[i+edit['delete']:]
              after=text.encode();assert hashlib.sha256(after).hexdigest()==item['after']
              prepared.append((p,after))
          for p,data in prepared:p.write_bytes(data)
          pathlib.Path('qa-output/reviewed-delta.json').write_bytes(raw)
          PY
          node tools/verify-release.mjs
          node --check src/legacy/module-02.mjs
          python3 -m py_compile tools/maintenance-browser-qa.py
          git -c core.whitespace=cr-at-eol diff --check
          git diff > qa-output/integration.patch
          git config user.name 'Asfalto maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/legacy/module-02.mjs tools/maintenance-browser-qa.py tools/audit-preparation-isolation.test.mjs
          git rm .github/workflows/resume-finalize.yml
          git commit -m 'fix: isolate race preparation from the driving loop and bound software-GPU QA'
          git push origin HEAD:fixes/audit-20260919
          git rev-parse HEAD > qa-output/revision.txt
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-resume-integration
          path: qa-output/
          retention-days: 14
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.integrate.outputs.revision }}
          persist-credentials: false
      - name: Full suite and preserved physics
        run: |
          mkdir -p qa-output
          git rev-parse HEAD > qa-output/revision.txt
          node tools/verify-release.mjs
          node tools/cinematic-audit.mjs qa-output/load-graph.json > qa-output/protected-files.json
      - name: Prepare actual browser and static application
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          node server.mjs --port 4173 > qa-output/server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/healthz
      - name: Real normal/logarithmic depth, profile transitions and resource disposal
        run: python3 tools/cinematic-browser-qa.py --output qa-output/fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-resume-fixture
          path: qa-output/
          retention-days: 14
      - name: Actual cancel, retry, five circuits, simulation, pause and workshop return
        run: python3 tools/maintenance-browser-qa.py --output qa-output/game
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-resume-browser
          path: qa-output/
          retention-days: 14
