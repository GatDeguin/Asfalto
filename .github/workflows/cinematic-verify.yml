name: Cinematic verification
on:
  push:
    branches: [graphics/cinematic-ultra-20260918]
    paths: [.github/workflows/cinematic-verify.yml]
  pull_request:
    paths: ['src/render/**', 'src/performance/**', 'tools/cinematic-*', '.github/workflows/cinematic-verify.yml']
permissions:
  contents: read
concurrency:
  group: cinematic-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Strict Cinematic contracts and protected files
        run: |
          mkdir -p qa-output
          git rev-parse HEAD | tee qa-output/revision.txt
          node --version | tee qa-output/node-version.txt
          node --test tools/cinematic-*.test.mjs | tee qa-output/cinematic-contracts.tap
          node tools/cinematic-audit.mjs qa-output/load-graph.json > qa-output/protected-files.json
          node --check src/legacy/module-02.mjs
          node --check src/legacy/v6-complete-runtime.js
      - name: Record entire available suite including pre-existing failures
        run: |
          set +e
          node --test tools/*.test.mjs > qa-output/full-suite.tap 2>&1
          echo $? > qa-output/full-suite-exit-code.txt
          exit 0
      - name: Install browser QA dependencies only
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Start existing static server with supported arguments
        run: |
          node server.mjs --port 4173 > qa-output/server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/tools/cinematic-webgl.html > /dev/null
      - name: Compile real shaders and capture same-scene spatial comparisons
        run: python3 tools/cinematic-browser-qa.py --base-url http://127.0.0.1:4173 --output qa-output/fixture
      - name: Diagnose actual vehicle render independently of the capture fixture
        timeout-minutes: 6
        run: python3 tools/cinematic-render-diagnosis.py --output qa-output/diagnosis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cinematic-fixture-verification
          path: qa-output/
          retention-days: 7
      - name: Exercise actual workshop and five circuit scenarios
        timeout-minutes: 12
        run: python3 tools/cinematic-browser-qa.py --base-url http://127.0.0.1:4173 --output qa-output/browser --full-game --skip-fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cinematic-verification
          path: qa-output/
          retention-days: 7
