name: Asfalto verification and gated release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asfalto-verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Full suite, syntax, reachable imports and protected contracts (blocking)
        run: |
          mkdir -p qa-output
          git rev-parse HEAD > qa-output/revision.txt
          node --version > qa-output/node-version.txt
          node tools/verify-release.mjs
      - name: Install isolated browser QA
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Start the existing static server
        run: |
          node server.mjs --port 4173 > qa-output/server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/healthz > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/healthz
      - name: Real WebGL shader, depth and resource contracts
        run: python3 tools/cinematic-browser-qa.py --output qa-output/fixture
      - name: Real workshop, cancellation, startup and circuit smoke tests
        run: python3 tools/audit-browser-qa.py --output qa-output/browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: asfalto-verification-${{ github.run_id }}
          path: qa-output/
          retention-days: 7
  # Only this source branch promotes to the configured Pages branch. A direct
  # administrative push to gh-pages is outside this gate; protect it in Settings.
  publish:
    needs: verify
    if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: asfalto-pages-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Promote exactly the verified revision without overwriting concurrent changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/pages --jq '.source.branch')" = gh-pages
          git fetch origin gh-pages release
          test "$(git rev-parse origin/release)" = "$GITHUB_SHA"
          git merge-base --is-ancestor origin/gh-pages "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/gh-pages"
          # A GITHUB_TOKEN push does not trigger the automatic Pages workflow.
          # Explicitly request the build of its configured gh-pages source.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > pages-request.json
      - name: Confirm the requested revision was actually published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > pages-status.json
            commit=$(jq -r .commit pages-status.json)
            status=$(jq -r .status pages-status.json)
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = built ]; then exit 0; fi
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = errored ]; then cat pages-status.json; exit 1; fi
            sleep 5
          done
          cat pages-status.json
          exit 1
