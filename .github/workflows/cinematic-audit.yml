name: Cinematic source audit
on:
  push:
    branches: [graphics/cinematic-ultra-20260918]
    paths: [.github/workflows/cinematic-audit.yml]
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package source and inventory (no build or deployment)
        shell: bash
        run: |
          mkdir -p audit-output
          git rev-parse HEAD > audit-output/revision.txt
          git ls-tree -rl HEAD > audit-output/tree.txt
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          extensions = {'.js', '.mjs', '.cjs', '.json', '.html', '.css', '.md', '.txt', '.yml', '.yaml', '.wasm', '.py', '.bat'}
          with zipfile.ZipFile('audit-output/source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  p = pathlib.Path(name)
                  if name and p.is_file() and (p.suffix.lower() in extensions or p.name in {'.nojekyll', '.gitignore', '.gitattributes', 'LICENSE'}):
                      archive.write(p, name)
          PY
          node --version > audit-output/node-version.txt
          find . -name package.json -o -name AGENTS.md -o -path '*/tests/*' > audit-output/test-inventory.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cinematic-source
          path: audit-output/
          retention-days: 7
