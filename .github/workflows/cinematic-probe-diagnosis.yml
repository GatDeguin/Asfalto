name: Cinematic probe diagnosis
on:
  push:
    branches: [graphics/cinematic-ultra-20260918]
    paths: [.github/workflows/cinematic-probe-diagnosis.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          mkdir -p qa-output
          node server.mjs --port 4173 > qa-output/server.log 2>&1 &
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - run: python3 tools/cinematic-probe-diagnosis.py
        timeout-minutes: 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cinematic-probe-diagnosis
          path: qa-output/
          retention-days: 7
