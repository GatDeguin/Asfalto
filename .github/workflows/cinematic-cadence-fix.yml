name: Apply verified legacy cadence fix
on:
  push:
    branches: [graphics/cinematic-ultra-20260918]
    paths: [.github/workflows/cinematic-cadence-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/graphics/cinematic-ultra-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: graphics/cinematic-ultra-20260918
      - name: Apply exactly one byte-checked presentation-only condition
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('src/legacy/module-02.mjs')
          old=p.read_bytes()
          assert hashlib.sha256(old).hexdigest()=='1121cb71bfc4aefdef5bc4db5deabe4c089b22c704fbb6b092356b6a48c0904e'
          a=b"environmentFrame++;if(!force&&environmentFrame%2&&performanceState.qualityTier!=='high')return;"
          b=b"environmentFrame++;if(!force&&environmentFrame%2&&!isHighGraphicsQuality(performanceState.qualityTier))return;"
          assert old.count(a)==1
          new=old.replace(a,b)
          assert hashlib.sha256(new).hexdigest()=='376aec6dbbf3e4941f50e84946a3b64364526780cdb2c05066151990af341cea'
          p.write_bytes(new)
          PY
          node --test tools/cinematic-*.test.mjs
          node --check src/legacy/module-02.mjs
          node tools/cinematic-audit.mjs
      - name: Commit only the one-line fix and remove this transport workflow
        run: |
          git config user.name 'Cinematic review automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/legacy/module-02.mjs
          git rm .github/workflows/cinematic-cadence-fix.yml
          git commit -m 'fix(graphics): retain High procedural update cadence in manual Cinematic'
          git push origin HEAD:graphics/cinematic-ultra-20260918
