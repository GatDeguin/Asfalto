name: Verify v8 release
on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node tools/verify-v8-release.mjs
      - run: node --check src/legacy/module-02.mjs
      - run: node --check src/legacy/v6-complete-runtime.js
