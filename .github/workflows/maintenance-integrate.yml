name: Integrate and validate audited maintenance
on:
  push:
    branches: [fixes/audit-20260919]
    paths: [.github/workflows/maintenance-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/fixes/audit-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fixes/audit-20260919
          fetch-depth: 0
      - name: Apply checked hidden-render regression fix
        run: |
          set -euo pipefail
          mkdir -p qa-output
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=pathlib.Path('.maintenance-review/followup.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='38c21e736e84ee9129574af21fb74bd4d7160bd42685389aa16e02f7b191e053'
          manifest=json.loads(raw);changes=[]
          for item in manifest['files']:
              path=pathlib.Path(item['path'])
              assert str(path).startswith(('src/','tools/')) and '..' not in path.parts
              before=path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(before).hexdigest()==item['before'],str(path)
              text=before.decode()
              for edit in reversed(item['edits']):
                  if 'old' in edit:
                      assert text.count(edit['old'])==1
                      text=text.replace(edit['old'],edit['new'])
                  else:
                      i=edit['start'];text=text[:i]+edit['insert']+text[i+edit['delete']:]
              after=text.encode();assert hashlib.sha256(after).hexdigest()==item['after'],str(path)
              changes.append((path,after))
          for path,data in changes:path.write_bytes(data)
          pathlib.Path('qa-output/changed-files.json').write_text(json.dumps([str(path) for path,_ in changes]))
          PY
          node tools/verify-release.mjs
          node tools/cinematic-audit.mjs qa-output/load-graph.json > qa-output/protected-files.json
          node --check src/legacy/v6-complete-runtime.js
          python3 -m py_compile tools/maintenance-browser-qa.py
      - name: Commit verified fix only to isolated branch
        run: |
          git config user.name 'Asfalto maintenance verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/legacy/v6-complete-runtime.js tools/maintenance-browser-qa.py tools/audit-loading-visibility.test.mjs
          git rm .maintenance-review/followup.json
          git commit -m 'fix: stop hidden workshop rendering while the loading presentation owns the screen'
          git push origin HEAD:fixes/audit-20260919
          git rev-parse HEAD > qa-output/revision.txt
      - name: Install QA browser and launch actual static application
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          node server.mjs --port 4173 > qa-output/server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/healthz
      - name: Compile real WebGL shaders and resource transitions
        run: python3 tools/cinematic-browser-qa.py --output qa-output/fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: asfalto-maintenance-contracts-fixtures
          path: qa-output/
          retention-days: 14
      - name: Verify real cancellation, retry, five circuits and workshop return
        run: python3 tools/maintenance-browser-qa.py --output qa-output/game
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: asfalto-maintenance-complete
          path: qa-output/
          retention-days: 14
