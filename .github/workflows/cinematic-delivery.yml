name: Cinematic review delivery
on:
  push:
    branches: [graphics/cinematic-ultra-20260918]
    paths: [docs/cinematic-ultra/REPORT.md]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify new contracts and unchanged protected source
        run: |
          mkdir -p qa-output
          set -o pipefail
          node --test tools/cinematic-*.test.mjs | tee qa-output/cinematic-contracts.tap
          node tools/cinematic-audit.mjs qa-output/load-graph.json > qa-output/protected-source.json
      - name: Record full suite with its actual exit code, not a green-suite claim
        run: |
          set +e
          node --test tools/*.test.mjs > qa-output/full-suite.tap 2>&1
          echo $? > qa-output/full-suite-exit-code.txt
          exit 0
      - name: Export the exact committed source delta and validate roundtrip
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tempfile,zipfile
          base='045cd8b7d206418a26d7a75666e557a7e124377a'
          out=pathlib.Path('qa-output')
          def git(*args,**kwargs):return subprocess.check_output(['git',*args],**kwargs)
          revision=git('rev-parse','HEAD').decode().strip()
          patch=git('diff','--binary',base,'HEAD')
          (out/'Asfalto-Cinematic-Ultra.patch').write_bytes(patch)
          names=git('diff','--name-only','--diff-filter=ACMRT','-z',base,'HEAD').decode().strip('\0').split('\0')
          records=[]
          with zipfile.ZipFile(out/'changed-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  p=pathlib.Path(name)
                  data=p.read_bytes()
                  archive.writestr(name,data)
                  records.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          with tempfile.TemporaryDirectory() as temp:
              env={**os.environ,'GIT_INDEX_FILE':temp+'/index'}
              git('read-tree',base,env=env)
              subprocess.run(['git','apply','--cached','--check','-'],input=patch,env=env,check=True)
              subprocess.run(['git','apply','--cached','-'],input=patch,env=env,check=True)
              tree=git('write-tree',env=env).decode().strip()
              expected=git('rev-parse','HEAD^{tree}').decode().strip()
              assert tree==expected,'Patch did not reconstruct exact commit tree'
          (out/'delivery-manifest.json').write_text(json.dumps({'base':base,'revision':revision,'patchReconstructsExactTree':True,'tree':tree,'files':records},indent=2))
          (out/'changed-files.txt').write_text('\n'.join(names)+'\n')
          (out/'revision.txt').write_text(revision+'\n')
          (out/'change-summary.txt').write_bytes(git('diff','--stat',base,'HEAD'))
          print('Verified patch roundtrip:',revision,'files:',len(names))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cinematic-review-delivery
          path: qa-output/
          retention-days: 7
