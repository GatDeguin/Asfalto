name: Final visual regressions and guarded Pages release
on:
  push:
    branches: [fixes/audit-20260919]
    paths: [.github/workflows/fix-visible-captures.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/fixes/audit-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.integrate.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply reviewed byte-checked changes and verify complete suite
        id: integrate
        run: |
          set -euo pipefail
          mkdir -p qa-output
          python3 - <<'PY'
          import hashlib,json,pathlib
          manifest=json.loads(r'''[{"path":"src/legacy/module-02.mjs","before":"539b48c823bd660abebadf9fe4a0297bf2b324e9235299de2e1c587a778393ee","after":"1c8202f6cc5e28479d5908d682acf19c0669df4a8d37e178c73dfc86b2e9873c","edits":[{"start":455534,"delete":0,"insert":"      // Track/reset discontinuities must not interpolate from the previous route.\r\n      raceCameraInitialized=false;lastPhysicalCameraPose=null;\r\n"}]},{"path":"src/render/auxiliary-capture-schedule.mjs","before":"c0e8b0b60d00adf32b77552c3a7a79f8f8da28d05d4d1806763fa7f6898065a5","after":"856ae95acc7dd359d6609684a4e17f05857111f6eb9705e15513848a413112ad","edits":[{"start":1016,"delete":171,"insert":"  // Preserve relative deadlines across slow frames; resetting all of them would starve mirrors behind water.\n  const reset=last===null||time<last||quality!==next;now=time;last=time;quality=next;rates=AUXILIARY_CAPTURE_RATES[next]||AUXILIARY_CAPTURE_RATES.balanced;\n"}]},{"path":"tools/maintenance-browser-qa.py","before":"c264b43da2e2377d6eb61407cb588120eda302043e69491d80311aa13e4fbfc7","after":"989276b732a68f38c67b7c4d8f2aaad041b204002cb923b1a4fac583bbcc7e4a","edits":[{"start":8787,"delete":0,"insert":"                mirrors_before = page.evaluate('__cockpit.mirrorDiagnostics()')\n"},{"start":9319,"delete":368,"insert":"                page.evaluate('__cockpit.prepareRacePresentation();__cockpit.advance(3.25);__cockpit.prepareRacePresentation()')\n                case['diagnostics'] = page.evaluate(\"\"\"()=>({render:__cockpit.v7RenderDiagnostics(),performance:__cockpit.raceWorld.getPerformanceDiagnostics(),state:__cockpit.raceGetState(),camera:__cockpit.raceCameraMode(),fault:__cockpit.runtimeFailureDiagnostics(),mirrors:__cockpit.mirrorDiagnostics()})\"\"\")\n"},{"start":10113,"delete":0,"insert":"                camera_position = case['diagnostics']['render']['camera']['position']\n                car_position = case['diagnostics']['state']['physicsSnapshot']['chassis']['position']\n                distance = sum((a-b)**2 for a,b in zip(camera_position,car_position))**.5\n                case['cameraDistanceM'] = distance\n                assert distance < (3 if camera == 'cockpit' else 12), 'Camera retained the previous circuit pose: ' + str(distance)\n                if camera == 'cockpit':\n                    mirrors_after = case['diagnostics']['mirrors']\n                    for feed in ['centerFrames','leftFrames']:\n                        assert mirrors_after[feed] > mirrors_before[feed], 'Auxiliary capture starvation: '+feed\n"},{"start":10656,"delete":97,"insert":"            wait(\"document.body.classList.contains('v6-menu-open')&&!document.body.classList.contains('an-loading-open')&&document.querySelector('#an-session-loading')?.hidden!==false&&__chevyV6Complete.workshop.active\", 'returned-to-workshop', 60)\n"}]},{"path":"tools/audit-camera-transfer.test.mjs","before":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","after":"c4aef644d14b72159b7fb2a2d078e6bc8b8c4b71752a1624d0df4a64f7857a49","edits":[{"start":0,"delete":0,"insert":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport vm from 'node:vm';\nconst source=fs.readFileSync(new URL('../src/legacy/module-02.mjs',import.meta.url),'utf8');\nconst start=source.indexOf(\"    onVehicleReset({ speedMps = 0, gear = 'N', reason } = {}) {\");\nconst end=source.indexOf('    onInputCaptureRelease()',start);\nconst method=source.slice(start,end).trim().replace(/,$/,'');\n\ntest('the real host invalidates camera interpolation on circuit transfer, rollback and restart without changing calibration',()=>{\n assert.ok(start>0&&end>start);\n for(const reason of ['circuit-change','circuit-rollback','race-reset','race-start']){\n  const calibration=Object.freeze({focalLengthMm:35,positionOffsetM:[1,2,3]});\n  const context={raceCameraInitialized:true,lastPhysicalCameraPose:{position:[0,2.5,1]},calibration,\n   raceCameraState:{current:\"chase\"},mobileDrivingControls:null,raceChevyPresentation:null,cockpitIgnition:null,\n   headMotion:{reset(){}},cockpitHeadRoot:{position:{set(){}},quaternion:{identity(){}}},\n   cameraEntrance:{cancel(){},start(){}},cameraOpening:{cancel(){},start(){}},\n   window:{matchMedia:()=>({matches:true})},spawnParkingHold:{reset(){}},createVehicleState:()=>({}),debugControls:{},updateKeyUi(){},reason};\n  vm.createContext(context);vm.runInContext(`({${method}}).onVehicleReset({reason});`,context);\n  assert.equal(context.raceCameraInitialized,false,reason+' must snap to the new physical pose on its first frame');\n  assert.equal(context.lastPhysicalCameraPose,null);assert.strictEqual(context.calibration,calibration);\n }\n});\n"}]},{"path":"tools/audit-capture-fairness.test.mjs","before":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","after":"588f1d79bd211eef254a55832ce89087a3051880f338931401b5c4a1b97daa1b","edits":[{"start":0,"delete":0,"insert":"import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {createAuxiliaryCaptureSchedule} from '../src/render/auxiliary-capture-schedule.mjs';\n\ntest('slow frames cannot starve live mirrors behind water captures',()=>{\n for(const interval of [300,1000,5000]){\n  const schedule=createAuxiliaryCaptureSchedule(),counts={water:0,center:0,left:0};\n  for(let frame=0;frame<12;frame++){\n   schedule.beginFrame(frame*interval,{quality:'low',mirrors:true});let used=0;\n   for(const id of Object.keys(counts))if(schedule.take(id)){counts[id]++;used++;}\n   assert.ok(used<=2,'capture burst is still bounded');\n  }\n  assert.ok(counts.water>0);assert.ok(counts.center>0,'center mirror receives service at '+interval+'ms');assert.ok(counts.left>0,'left mirror receives service at '+interval+'ms');\n }\n});\ntest('return from a long pause services all views without an unlimited catch-up burst',()=>{\n const schedule=createAuxiliaryCaptureSchedule();schedule.beginFrame(0,{quality:'high',mirrors:true});schedule.take('water');\n const seen=new Set();\n for(let i=0;i<4;i++){\n  schedule.beginFrame(60000+i*17,{quality:'high',mirrors:true});let used=0;\n  for(const id of ['water','center','left'])if(schedule.take(id)){seen.add(id);used++;}\n  assert.ok(used<=2);\n }\n assert.deepEqual([...seen].sort(),['center','left','water']);\n schedule.beginFrame(1,{quality:'balanced',mirrors:false});assert.equal(schedule.take('center'),false);assert.equal(schedule.take('left'),false);assert.equal(schedule.take('water'),true);\n});\n"}]}]''')
          allowed={'src/legacy/module-02.mjs','src/render/auxiliary-capture-schedule.mjs','tools/maintenance-browser-qa.py','tools/audit-camera-transfer.test.mjs','tools/audit-capture-fairness.test.mjs'}
          assert {item['path'] for item in manifest}==allowed
          prepared=[]
          for item in manifest:
              path=pathlib.Path(item['path']);before=path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(before).hexdigest()==item['before'], 'Concurrent change: '+str(path)
              text=before.decode('utf-8')
              for edit in reversed(item['edits']):
                  start=edit['start'];text=text[:start]+edit['insert']+text[start+edit['delete']:]
              after=text.encode('utf-8');assert hashlib.sha256(after).hexdigest()==item['after'],str(path)
              prepared.append((path,after))
          for path,data in prepared:path.write_bytes(data)
          pathlib.Path('qa-output/reviewed-delta.json').write_text(json.dumps(manifest))
          PY
          node tools/verify-release.mjs
          node tools/cinematic-audit.mjs qa-output/load-graph.json > qa-output/protected-files.json
          node --check src/legacy/module-02.mjs
          python3 -m py_compile tools/maintenance-browser-qa.py
          git -c core.whitespace=cr-at-eol diff --check
          git diff > qa-output/integration.patch
          git config user.name 'Asfalto maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/legacy/module-02.mjs src/render/auxiliary-capture-schedule.mjs tools/maintenance-browser-qa.py tools/audit-camera-transfer.test.mjs tools/audit-capture-fairness.test.mjs
          git rm .github/workflows/fix-visible-captures.yml
          git commit -m 'fix: reset camera across routes and prevent slow-frame mirror starvation'
          git push origin HEAD:fixes/audit-20260919
          git rev-parse HEAD > qa-output/revision.txt
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-visual-integration
          path: qa-output/
          retention-days: 14
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.integrate.outputs.revision }}
          persist-credentials: false
      - name: Verify exact committed revision
        run: |
          mkdir -p qa-output
          git rev-parse HEAD > qa-output/revision.txt
          node tools/verify-release.mjs
          node tools/cinematic-audit.mjs qa-output/load-graph.json > qa-output/protected-files.json
      - name: Prepare real browser and static server
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          node server.mjs --port 4173 > qa-output/server.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/healthz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/healthz
      - name: Real WebGL normal/log depth, profiles and resource disposal
        run: python3 tools/cinematic-browser-qa.py --output qa-output/fixture
      - name: Five circuits with camera, mirrors, cancellation, retry, pause and rendered workshop
        run: python3 tools/maintenance-browser-qa.py --output qa-output/game
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-visual-browser
          path: qa-output/
          retention-days: 14
  publish:
    needs: [integrate, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/fixes/audit-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.integrate.outputs.revision }}
          fetch-depth: 0
      - name: Publish only the exact tested revision to the existing Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.integrate.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/pages --jq '.source.branch')" = gh-pages
          git fetch origin gh-pages
          git merge-base --is-ancestor origin/gh-pages HEAD
          git push origin HEAD:gh-pages
          gh api --method POST repos/$GITHUB_REPOSITORY/pages/builds > pages-request.json
          for i in $(seq 1 100); do
            gh api repos/$GITHUB_REPOSITORY/pages/builds/latest > pages-build.json
            STATE=$(jq -r .status pages-build.json)
            REVISION=$(jq -r .commit pages-build.json)
            if [ "$REVISION" = "$VERIFIED_SHA" ] && [ "$STATE" = built ]; then cat pages-build.json; exit 0; fi
            if [ "$REVISION" = "$VERIFIED_SHA" ] && [ "$STATE" = errored ]; then cat pages-build.json; exit 1; fi
            sleep 5
          done
          echo 'The tested revision was not confirmed by Pages within the deployment window.' >&2
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-visual-pages-status
          path: pages-*.json
          retention-days: 14
