name: Apply checked active pigment contract
on:
  push:
    branches: [graphics/cinematic-ultra-20260918]
    paths: [.github/workflows/cinematic-pigment-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/graphics/cinematic-ultra-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: graphics/cinematic-ultra-20260918
      - name: Apply source-checked pigment mask change
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('src/render/advanced-materials.mjs');old=p.read_bytes()
          assert hashlib.sha256(old).hexdigest()=='48658657c2480d3f8671d43f8a648b46f7ae578118aadff32518a556e0ec1b49'
          a="const maskedPaint=entry.role==='paint'&&shader.fragmentShader.includes('float chevyPaintMask');\n    const detail=DETAIL_SAMPLE.replace('AN_AM_SURFACE_MASK',maskedPaint?'mix(1.,chevyPaintMask,anAMCinematic)':'1.');"
          b="const chevyMask=entry.role==='paint'&&shader.fragmentShader.includes('float chevyPaintMask');\n    const pigmentMask=chevyMask?'chevyPaintMask':entry.role==='paint'&&shader.fragmentShader.includes('float vehiclePigment')?'vehiclePigment':null;\n    const detail=DETAIL_SAMPLE.replace('AN_AM_SURFACE_MASK',pigmentMask?'mix(1.,'+pigmentMask+',anAMCinematic)':'1.');"
          text=old.decode();assert text.count(a)==1
          text=text.replace(a,b).replace('(maskedPaint?', '(chevyMask?').replace('if(maskedPaint)', 'if(chevyMask)')
          new=text.encode();assert hashlib.sha256(new).hexdigest()=='27d20b0542c84a387b93945450a6f72572ba821ade183e658c28153a724f4e49'
          p.write_bytes(new)
          PY
          node --test tools/cinematic-*.test.mjs
          node --check src/render/advanced-materials.mjs
          node tools/cinematic-audit.mjs
      - name: Commit only the reviewed change and remove transport
        run: |
          git config user.name 'Cinematic review automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render/advanced-materials.mjs
          git rm .github/workflows/cinematic-pigment-fix.yml
          git commit -m 'fix(graphics): respect both active exterior and legacy Chevy pigment masks'
          git push origin HEAD:graphics/cinematic-ultra-20260918
